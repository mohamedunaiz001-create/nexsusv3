[project]
name = "nexsus-api"
version = "0.3.0"
description = "nexsus FastAPI backend — CEO orchestration + specialist agents"
requires-python = ">=3.11"
# Canonical dependency declaration. apps/api/requirements.txt mirrors this
# list exactly (pinned) for Docker/`pip install -r` workflows that don't
# resolve pyproject.toml; tests/backend/test_dependency_parity.py fails the
# build if the two ever drift apart.
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "pydantic[email]==2.9.2",
    "pydantic-settings==2.5.2",
    "sqlalchemy==2.0.35",
    "alembic==1.13.3",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",
    "redis==5.0.8",
    "celery==5.4.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.9",
    "httpx==0.27.2",
    "structlog==24.4.0",
    "python-dotenv==1.0.1",
    "tenacity==9.0.0",
    "reportlab==4.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "httpx==0.27.2",
    "aiosqlite==0.20.0",
    "ruff==0.6.9",
    "black==24.8.0",
    "mypy==1.11.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Without this, setuptools' flat-layout auto-discovery finds both `app/`
# and `alembic/` under apps/api and refuses to build ("Multiple top-level
# packages discovered"), which made `pip install -e .` fail outright.
packages = ["app"]

